name: Update StatChasers Data

on:
  # Run every Tuesday at 6 AM UTC during the NFL season (Sep - Feb)
  schedule:
    - cron: "0 6 * * 2"

  # Allow manual runs at any time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull Sleeper player data
        run: python scripts/pull_sleeper_players.py

      - name: Pull nflverse play-by-play data
        run: python scripts/pull_nflverse_data.py

      - name: Compute player metrics
        run: python scripts/compute_player_metrics.py

      - name: Build performance analytics output
        run: python scripts/build_performance_analytics.py

      - name: Build Stat Explorer output
        run: python scripts/build_stat_explorer.py

      - name: Build QB trends output
        run: python scripts/build_qb_trends.py

      - name: Build RB advanced stats output
        run: python scripts/build_rb_advanced_stats.py

      - name: Build RB player overview output
        run: python scripts/build_rb_player_overview.py

      - name: Build RB efficiency analytics output
        run: python scripts/build_rb_efficiency_analytics.py

      - name: Build RB usage and role output
        run: python scripts/build_rb_usage_role.py

      - name: Build WR advanced stats output
        run: python scripts/build_wr_advanced_stats.py

      - name: Build WR player overview output
        run: python scripts/build_wr_player_overview.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage generated output files only
          git add output/performance_analytics_latest.json
          git add output/performance_analytics_2025.json
          git add output/stat_explorer_*.json
          git add output/qb_trends.json
          git add output/rb_advanced_stats.json
          git add output/rb_advanced_stats_2023.json
          git add output/rb_advanced_stats_2024.json
          git add output/rb_advanced_stats_2025.json
          git add output/rb_advanced_stats_all.json
          git add output/rb_player_overview.json
          git add output/rb_efficiency_analytics.json
          git add output/rb_usage_role.json
          git add output/wr_advanced_stats.json
          git add output/wr_advanced_stats_2023.json
          git add output/wr_advanced_stats_2024.json
          git add output/wr_advanced_stats_2025.json
          git add output/wr_advanced_stats_all.json
          git add output/wr_player_overview.json
          git add output/wr_player_overview_2023.json
          git add output/wr_player_overview_2024.json
          git add output/wr_player_overview_2025.json
          git add output/wr_player_overview_all.json
          git add data/raw/sleeper_players.json

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit. Data is already up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: update performance analytics data [${TIMESTAMP}]"
            git push
            echo "Data updated and pushed successfully."
          fi
